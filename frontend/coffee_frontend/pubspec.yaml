name: coffee_frontend
description: "A coffee brewing and social app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.3.3
  provider: ^6.0.5
  google_sign_in: ^6.1.5
  cached_network_image: ^3.3.0
  video_player: ^2.8.1
  chewie: ^1.7.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  dropdown_search: ^5.0.6
  flutter_spinkit: ^5.2.0
  intl: ^0.18.1
  shared_preferences: ^2.2.1
  font_awesome_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
